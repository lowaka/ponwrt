name: Build XG2010G Firmware

# 上游的 .github/workflows/release.yml 保持原样；这份是带 custom/ 定制层的构建 + 发布。
# 定制内容全部放在 custom/ 目录里，同步 pbs05/ponwrt 上游时不会被覆盖。
#
# 本 workflow 只编译 XG2010G（airoha/an7581 → gemtek_xg2010g）：
#   上游 configs/an7581.config 默认选中 9 个 an7581 机型，这里用
#   custom/config.device + 一条 sed 规则把它收敛成 1 个机型，
#   产物也只打包 xg2010g 的文件（不再打包整个 an7581 目录和 packages）。
#
# 2026-10-11：代理插件改为**只采用 daed**（OpenClash / Nikki 完全移除），
# IPTV 改用 rtp2httpd，主题固定 Aurora。daed 需要 KERNEL_DEBUG_INFO_BTF +
# KERNEL_BPF_EVENTS，而上游 configs/an7581.config 恰好是反的，这两条在
# custom/config.fragment 里覆盖（该文件最后追加，优先级最高）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空 = 自动生成 xg2010g-<日期>-<提交>）'
        required: false
        type: string
      prerelease:
        description: '标记为预发布（Pre-release）'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
    paths:
      - 'custom/**'
      - '.github/workflows/xg2010g-build.yml'

permissions:
  contents: read

concurrency:
  group: xg2010g-build
  cancel-in-progress: false

jobs:
  build:
    name: Build an7581 (XG2010G only)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-xg2010g-dl-${{ hashFiles('feeds.conf.default', 'configs/*.config', 'custom/feeds.conf.custom', 'custom/config.fragment', 'custom/config.device', 'custom/config.trim') }}
          restore-keys: |
            ponwrt-dl-an7581-
            ponwrt-dl-

      - name: Install feeds
        run: |
          # [custom] 把定制 feed 追加到 feeds.conf（即 feeds.conf.default 之后）。
          # 上游 ponwrt 没有 daed 面板所在的 kenzok8/openwrt-daede feed。
          if [ -f custom/feeds.conf.custom ]; then
            cat feeds.conf.default custom/feeds.conf.custom > feeds.conf
          else
            cp feeds.conf.default feeds.conf
          fi
          echo "== feeds.conf =="
          cat feeds.conf
          # scripts/feeds 剥注释用的是 s/#.+$//，.+ 要求 # 后至少一个字符，
          # 所以「裸 # 行」不会被当注释，会报 Syntax error in feeds.conf, line N。
          if grep -n '^#$' feeds.conf; then
            echo "::error::feeds.conf 存在裸 # 行（上面已列出行号）"
            exit 1
          fi
          grep -q '^src-git daede ' feeds.conf || { echo "::error::缺 daede feed"; exit 1; }

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom layer (files overlay)
        run: |
          mkdir -p files
          cp -a custom/files/. files/
          echo "== files/ 覆盖层内容 =="
          find files -type f | sort

      - name: Add Aurora theme package
        run: |
          # Aurora 主题的 Makefile 在仓库根目录，而 luci.mk 用「目录名」推导包名
          # （LUCI_NAME?=$(notdir ${CURDIR})）。必须克隆到 package/luci-theme-aurora，
          # 否则包名会变成 "aurora"，CONFIG_PACKAGE_luci-theme-aurora 不会生效。
          rm -rf package/luci-theme-aurora
          git clone --depth 1 https://github.com/eamonxg/luci-theme-aurora.git package/luci-theme-aurora
          echo "== Aurora 主题版本 =="
          grep -E '^(PKG_VERSION|PKG_RELEASE):=' package/luci-theme-aurora/Makefile || true
          ls -d package/luci-theme-aurora/htdocs/luci-static/*/ 2>/dev/null || true

      - name: Configure an7581 (XG2010G only)
        run: |
          ./scripts/kconfig.pl + + \
            configs/an7581.config \
            configs/release.config \
            custom/config.fragment > .config

          # 再叠加"只保留 XG2010G"的机型选择 + 去掉与本机无关的包
          # （后面的文件覆盖前面的，含 "# ... is not set"）
          ./scripts/kconfig.pl + + .config custom/config.device custom/config.trim > .config.new
          mv .config.new .config

          # 双保险：只保留 CONFIG_TARGET_DEVICE_*（多选）里的 XG2010G。
          # 注意：绝不能动 CONFIG_TARGET_airoha_an7581_DEVICE_*，那是单选 choice，
          # 改了会让 kconfig 报 "changes choice state"，并在 defconfig 后把机型选择清空。
          sed -i -E 's/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(.+)=y$/# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set/' .config
          sed -i -E 's/^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_xg2010g is not set$/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_xg2010g=y/' .config

          echo "== defconfig 之前的机型行 =="
          grep -E 'TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_xg2010g' .config || true

          make defconfig

          echo "== 本次编译的机型 =="
          grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true
          n="$(grep -cE '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true)"
          echo "机型数量：$n"
          [ "$n" = "1" ] || { echo "::error::机型数量不是 1（实际 $n），机型收敛失败"; grep -n 'TARGET_DEVICE_airoha' .config | head -20; exit 1; }
          echo "== 透明代理 / IPTV / DDNS 在 .config 里的状态 =="
          grep -E 'CONFIG_PACKAGE_(luci-app-daede|daed|v2ray-geoip|v2ray-geosite|luci-app-rtp2httpd|rtp2httpd|ddns-go|luci-app-ddns-go|luci-theme-aurora|luci-app-openclash|luci-app-nikki|nikki|mihomo-meta|lucky|luci-app-lucky|msd_lite)(=| is not set)' .config | sort || true
          echo "== daed 后端选择（应为 _daed=y, _dae 未设）=="
          grep -E 'CONFIG_PACKAGE_luci-app-daede_(daed|dae)(=| is not set)' .config || true
          echo "== daed 的 kmod 依赖 =="
          grep -E 'CONFIG_PACKAGE_kmod-(sched-core|sched-bpf|xdp-sockets-diag|veth|inet-diag)=' .config | sort || true
          echo "== daed 的内核前提（缺一不可）=="
          for sym in CONFIG_KERNEL_DEBUG_INFO_BTF CONFIG_KERNEL_BPF_EVENTS CONFIG_KERNEL_BPF_STREAM_PARSER; do
            if grep -q "^$sym=y$" .config; then echo "  [OK]  $sym=y"; else echo "::error::$sym 不是 =y，daed 运行时会拿不到 /sys/kernel/btf/vmlinux"; exit 1; fi
          done
          if grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config; then
            echo "::error::DEBUG_INFO_REDUCED 与 DEBUG_INFO_BTF 互斥，仍为 =y"; exit 1
          fi
          echo "== BPF 工具链（应为宿主机 LLVM，避免从源码编 LLVM）=="
          grep -E '^CONFIG_(DEVEL|BPF_TOOLCHAIN_HOST|BPF_TOOLCHAIN_BUILD_LLVM|BPF_TOOLCHAIN_NONE|USE_LLVM_HOST)=' .config | sort || true
          echo "== 精简项检查（若仍为 =y 说明被依赖自动选回，会给出警告）=="
          for sym in CONFIG_PACKAGE_u-boot-an7581_nokia_xg-040g-md \
                     CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray \
                     CONFIG_PACKAGE_luci-app-rclone_INCLUDE_rclone-ng \
                     CONFIG_PACKAGE_MAC80211_MESH CONFIG_PACKAGE_MAC80211_DEBUGFS; do
            grep -q "^$sym=y$" .config && echo "::warning::$sym 仍为 =y"
          done || true
          echo "== USB / 无线相关（=m 表示只编译成包、不装进固件）=="
          grep -E 'CONFIG_PACKAGE_[^=]*(usb|mt7915|mt7916|mt7996|wpad|mac80211|hostapd)[^=]*=' .config | sort || true

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build an7581
        run: make -j"$(nproc)"

      - name: Verify firmware content
        run: |
          set -e
          echo "== an7581 产物 =="
          ls -lh bin/targets/airoha/an7581/ | sed -n '1,60p'
          # 注意：只选一个机型时，manifest 名字是 ponwrt-airoha-an7581.manifest，不含设备名
          manifest="$(ls bin/targets/airoha/an7581/*.manifest 2>/dev/null | head -1)"
          [ -n "$manifest" ] || { echo "::error::目标目录里没有 manifest"; exit 1; }
          echo "manifest: $manifest"
          echo "-- 应当存在的包 --"
          for p in daed luci-app-daede v2ray-geoip v2ray-geosite rtp2httpd luci-app-rtp2httpd ddns-go luci-theme-aurora; do
            if grep -q "^$p " "$manifest"; then echo "  [OK]  $p"; else echo "::error::$p 不在镜像里"; exit 1; fi
          done
          echo "-- 应当缺席的包（出现说明没关掉）--"
          if grep -E '^(luci-app-openclash|luci-i18n-openclash-zh-cn|nikki|luci-app-nikki|luci-i18n-nikki-zh-cn|mihomo|mihomo-meta|msd_lite|luci-app-msd_lite|udpxy|luci-app-udpxy|lucky|luci-app-lucky|luci-app-daed) ' "$manifest"; then
            echo "::error::上面这些包不该出现在镜像里"
            exit 1
          else
            echo "  （无，符合预期）"
          fi
          echo "== 镜像内容体检 =="
          echo "镜像内软件包总数：$(grep -c . "$manifest")"
          echo "-- USB / 风扇 / 无线 / 其它机型 相关包（正常应为空或只有必要项）--"
          grep -Ei 'usb|fan|nct7802|mt7915|mt7916|mt7996|bluetooth|passwall|rclone|u-boot-an7581|znxt|nokia|fiberhome|unionman|hg5' "$manifest" || echo "（无）"

      - name: Pack XG2010G
        run: |
          mkdir -p release
          cd bin/targets/airoha/an7581
          shopt -s nullglob
          # 只打包 sysupgrade 镜像 + manifest + sha256sums。
          # 上游目录里还有 recovery 镜像，本机刷机走的是 U-Boot TFTP/HTTP，
          # 用不到它，省一半体积。
          files=(*xg2010g*sysupgrade* *.manifest sha256sums)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::没有生成 xg2010g 产物"
            exit 1
          fi
          echo "== 打包文件 =="
          ls -lh "${files[@]}"
          tar --zstd -cf "$GITHUB_WORKSPACE/release/ponwrt-xg2010g.tar.zst" "${files[@]}"
          echo "== 压缩包 =="
          ls -lh "$GITHUB_WORKSPACE/release/"

      - name: Upload XG2010G
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-xg2010g
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.zst > sha256sums

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="xg2010g-$(TZ=Asia/Shanghai date +%Y%m%d)-${GITHUB_SHA:0:8}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "使用的 tag：$tag"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="${tag}-r${GITHUB_RUN_NUMBER}"
          fi
          args=(
            "$tag"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt XG2010G $tag"
            --generate-notes
          )
          if [ -z "$PRERELEASE" ] || [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"